x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    image: dasskelett/nginx-quic:1.29.5
    container_name: main-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443/tcp"
      - "443:443/udp"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./sites:/var/www/sites:ro
      - ./sites-enabled:/etc/nginx/conf.d:ro
      - ./snippets:/etc/nginx/snippets:ro
      - ./secrets/.htpasswd:/etc/nginx/secrets/.htpasswd:ro
      - /etc/letsencrypt:/etc/letsencrypt:rw
      - /var/lib/letsencrypt:/var/lib/letsencrypt:rw
    networks:
      - shared_network
      - monitoring_network
    logging: *default-logging

  netdata:
    image: netdata/netdata:v2.12.1
    container_name: main-netdata
    restart: always
    hostname: ${NETDATA_HOSTNAME:-main-nginx}
    pid: host
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - netdata-config:/etc/netdata
      - netdata-lib:/var/lib/netdata
      - netdata-cache:/var/cache/netdata
      - /:/host/root:ro,rslave
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/log:/host/var/log:ro
      - /run/dbus:/run/dbus:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - monitoring_network
    logging: *default-logging

  portainer:
    image: portainer/portainer-ce:2.45.2-alpine
    container_name: main-portainer
    restart: always
    command:
      - -H
      - unix:///var/run/docker.sock
      - --base-url
      - /portainer
      - --trusted-origins
      - ${PORTAINER_TRUSTED_ORIGINS:-https://quizpet.mooo.com}
    volumes:
      - portainer-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - monitoring_network
    logging: *default-logging

networks:
  shared_network:
    external: true
  monitoring_network:
    name: main-monitoring_network
    driver: bridge

volumes:
  netdata-config:
    external: true
    name: main-nginx-netdata-config
  netdata-lib:
    external: true
    name: main-nginx-netdata-lib
  netdata-cache:
    external: true
    name: main-nginx-netdata-cache
  portainer-data:
    external: true
    name: main-nginx-portainer-data
