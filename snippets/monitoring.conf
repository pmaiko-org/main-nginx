location = /netdata {
    return 301 /netdata/;
}

location ~ ^/netdata/(?<ndpath>.*)$ {
    auth_basic "Monitoring";
    auth_basic_user_file /etc/nginx/secrets/.htpasswd;

    set $netdata_upstream http://main-netdata:19999;

    proxy_redirect off;
    proxy_http_version 1.1;
    proxy_pass_request_headers on;
    proxy_store off;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Server $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade_keepalive;

    proxy_pass $netdata_upstream/$ndpath$is_args$args;

    gzip on;
    gzip_proxied any;
    gzip_types *;
}

location = /portainer {
    return 301 /portainer/;
}

location ~ ^/portainer/(?<ppath>.*)$ {
    set $portainer_upstream http://main-portainer:9000;

    proxy_redirect off;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_pass $portainer_upstream/$ppath$is_args$args;
}
